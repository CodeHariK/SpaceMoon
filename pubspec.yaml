name: spacemoon
description: Connecting Universes
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.0.1+11

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.6

  firebase_core: ^4.2.1
  firebase_app_check: ^0.4.1+2
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.4
  cloud_functions: ^6.0.4
  firebase_storage: ^13.0.4
  firebase_auth: ^6.1.2
  firebase_crashlytics: ^5.0.5
  firebase_ui_auth: ^3.0.1
  firebase_ui_oauth_google: ^2.0.1
  firebase_ui_oauth_apple: ^2.0.1
  firebase_ui_firestore: ^2.0.1
  firebase_ui_localizations: ^2.0.1

  intl: ^0.20.2

  protobuf: ^6.0.0

  http: ^1.1.2

  hooks_riverpod: ^3.0.3

  shared_preferences: ^2.2.2

  path_provider: ^2.1.1
  path: ^1.8.3

  feedback: ^3.0.0

  scrollable_positioned_list: ^0.3.8

  flutter_animate: ^4.3.0
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.1

  flutter_chat_core: ^2.8.0
  flutter_link_previewer: ^4.1.2
  flutter_linkify: ^6.0.0

  image_picker: ^1.0.5
  photo_view: ^0.15.0
  video_player: ^2.8.1
  mime: ^2.0.0
  saver_gallery: ^4.0.1
  flutter_svg: ^2.0.9
  lottie: ^3.3.1

  barcode_widget: ^2.0.4

  fleather: ^1.23.0
  url_launcher: ^6.3.1

  mobile_scanner: ^7.0.0

  flutter_native_splash: ^2.3.8

  moonspace:
    path: ../MoonSpace
    # git:
    #   url: https://github.com/CodeHariK/MoonSpace.git

  moon_debug:
    path: ../MoonSpace/moon_debug
  flutter_hooks: ^0.21.3+1
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  riverpod_annotation: ^3.0.3

dependency_overrides:
  moonspace:
    path: ../MoonSpace

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.3
  build_runner: ^2.10.4
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.3

  flutter_launcher_icons: ^0.14.3
  go_router_builder: ^4.1.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/store/

flutter_launcher_icons:
  android: "ic_spacemoon"
  ios: true
  image_path: "assets/images/SpaceMoon.png"
  remove_alpha_ios: true
  min_sdk_android: 27
  web:
    generate: true
    image_path: "assets/images/SpaceMoon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/SpaceMoon.png"
  branding: assets/images/Trademark.png
  color_dark: "#ffffff"
  image_dark: "assets/images/SpaceMoon.png"
  branding_dark: assets/images/Trademark.png

  android_12:
    image: assets/images/SpaceMoon_android.png
    color: "#ffffff"
    branding: assets/images/Trademark.png
    image_dark: assets/images/SpaceMoon_android.png
